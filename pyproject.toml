[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papiro"
version = "0.1.0"
description = "Convierte documentos (PDF, Word, PowerPoint, Excel, HTML, EPUB, imágenes) a Markdown limpio para IA. Todo en local, con buen soporte de japonés."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["markdown", "pdf", "ocr", "rag", "llm", "japanese", "furigana", "tategaki"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pillow>=10",
    "mammoth>=1.6",
    "markdownify>=0.12",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "charset-normalizer>=3",
]

[project.optional-dependencies]
# Modo calidad: análisis de maqueta y tablas con docling (MIT). Descarga pesada (~2 GB con PyTorch).
calidad = ["docling>=2.50", "reportlab>=4", "rapidocr>=3", "onnxruntime>=1.17"]
# Arrastrar y soltar archivos dentro de la ventana.
gui = ["tkinterdnd2>=0.4"]
# Solo el OCR de japonés (PP-OCR, Apache-2.0), para usarlo con el modo rápido.
rapidocr = ["rapidocr>=3", "onnxruntime>=1.17"]
dev = ["pytest>=8", "python-docx>=1.1", "pikepdf>=9"]

[project.scripts]
papiro = "papiro.cli:main"

[project.gui-scripts]
papiro-gui = "papiro.gui:main"

[project.urls]
Homepage = "https://github.com/KrmIvan/papiro"

[tool.setuptools.packages.find]
include = ["papiro*"]

[tool.setuptools.package-data]
papiro = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: necesita Tesseract con jpn, jpn_vert, spa y eng",
    "calidad: necesita docling (modo calidad)",
]
